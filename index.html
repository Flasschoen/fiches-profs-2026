<!DOCTYPE html><html lang="fr"><head><script>/* EDU-GARDE-SESSION (2026-10-01) */(function(){
if(location.protocol!=='https:'||!window.fetch) return;
var orig=window.fetch.bind(window), affiche=false;
function bandeau(expiree){ if(affiche) return; affiche=true; var go=function(){
  var b=document.createElement('div'); b.id='edu-garde-session';
  b.setAttribute('style','position:fixed;left:0;right:0;top:0;z-index:2147483646;background:#c0392b;color:#fff;font:700 15px Calibri,Arial,sans-serif;padding:12px 16px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;box-shadow:0 3px 12px rgba(0,0,0,.35)');
  b.innerHTML=(expiree?'🔒 Votre session a expiré : la dernière action n’a PAS été enregistrée. Rechargez la page (F5), reconnectez-vous avec le code reçu par mail, puis refaites-la.'
                      :'📡 Connexion Internet interrompue : la dernière action n’a PAS été enregistrée. Vérifiez la connexion puis rechargez la page (F5).')
    +'<button type="button" style="background:#fff;color:#c0392b;border:none;border-radius:6px;padding:6px 14px;font-weight:800;cursor:pointer">🔄 Recharger la page</button>';
  b.querySelector('button').onclick=function(){ location.reload(); };
  document.body.appendChild(b); };
  if(document.body) go(); else document.addEventListener('DOMContentLoaded',go); }
async function sonder(){ try{ var r=await orig('/api/moi',{redirect:'manual',cache:'no-store'});
  if(r.type==='opaqueredirect'||r.status===401||r.status===403||r.status===302) return 'expiree';
  var t=(r.headers.get('content-type')||''); if(t.indexOf('json')<0) return 'expiree'; return 'ok'; }catch(e){ return 'coupure'; } }
window.fetch=async function(input,init){
  var url=(typeof input==='string')?input:(input&&input.url)||'';
  var api=/^\/api\//.test(url); try{ var u=new window.URL(url,location.href); api=(u.origin===location.origin&&u.pathname.indexOf('/api/')===0); }catch(e){} /* window.URL : l'outil Attractions a sa propre variable « URL » */
  if(!api) return orig(input,init);
  try{
    var r=await orig(input,init);
    if(r.redirected&&/cloudflareaccess\.com/.test(r.url)){ bandeau(true); }
    else if(r.status===403||r.status===401){ var c=r.clone(); c.text().then(function(t){ if(/connexion Cloudflare Access|Session expir|Jeton|Signature/i.test(t)) bandeau(true); }).catch(function(){}); }
    else if(r.ok&&(r.headers.get('content-type')||'').indexOf('text/html')===0){ bandeau(true); }
    return r;
  }catch(e){ sonder().then(function(s){ if(s!=='ok') bandeau(s==='expiree'); }); throw e; }
};
})();</script><meta charset="UTF-8"><meta http-equiv="refresh" content="0; url=TABLEAU%20DE%20BORD.html"><title>Educpass — Espace privé</title></head><body><a href="TABLEAU%20DE%20BORD.html">Ouvrir le Tableau de bord</a></body></html>
