<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIVEAUX — EDUCPASS 2026</title>
<style>
:root{
  --navy:#1e3a6e; --navy-dark:#152a52; --orange:#5b3fa0; --bg:#f0f4fa;
  --line:#d7e0ee; --ok:#27ae60; --err:#c0392b;
}
*{box-sizing:border-box;}
body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:#222;}
.hdr-bar{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.hdr-bar .logo{font-weight:900;letter-spacing:1px;}
.hdr-bar .title{font-weight:700;flex:1;}
.btn{border:none;border-radius:4px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;background:#eee;color:#222;}
.btn:hover{filter:brightness(0.95);}
.btn-save{background:var(--ok);color:#fff;}
.btn-cancel{background:#888;color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.toolbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#st-bar{padding:4px 16px;font-size:12px;color:#555;min-height:18px;}
#sync-pending{display:none;background:#f39c12;color:#fff;text-align:center;padding:4px;font-weight:700;font-size:12px;}
#sync-pending.show{display:block;animation:pulse 1s infinite alternate;}
@keyframes pulse{from{opacity:.6}to{opacity:1}}
.wrap{padding:14px 16px;}
table.results{border-collapse:collapse;width:100%;background:#fff;font-size:12.5px;}
table.results th{background:var(--navy);color:#fff;padding:6px 8px;text-align:left;position:sticky;top:0;white-space:nowrap;}
table.results td{padding:5px 8px;border-bottom:1px solid var(--line);}
table.results tr:nth-child(even){background:#f7faff;}
table.results tr:hover{background:#eaf1ff;cursor:pointer;}
.fiche-box{background:#fff;border-radius:6px;box-shadow:0 1px 6px rgba(30,58,110,.12);padding:16px 20px;max-width:800px;}
.fiche-hdr{font-size:20px;font-weight:900;color:var(--navy);margin-bottom:4px;}
.fiche-sub{color:#777;font-size:13px;margin-bottom:14px;}
fieldset{border:1px solid var(--line);border-radius:6px;margin-bottom:14px;padding:10px 14px 14px;}
legend{font-weight:700;color:var(--navy);padding:0 6px;font-size:13px;}
.frow{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px;}
.fitem label{display:block;font-size:11.5px;color:#555;margin-bottom:2px;font-weight:600;}
.fitem input,.fitem select,.fitem textarea{width:100%;padding:6px 7px;border:1px solid #bbb;border-radius:4px;font-size:13px;font-family:inherit;}
.hidden{display:none !important;}
.pin-box,.pin-mgr-box{background:#fff;border-radius:8px;padding:32px 40px;box-shadow:0 2px 20px rgba(0,0,0,.25);text-align:center;min-width:320px;}
#overlay-pin,#overlay-pin-mgr{position:fixed;inset:0;background:rgba(20,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:999;}
#overlay-loading{position:fixed;inset:0;background:rgba(20,30,50,.35);display:flex;align-items:center;justify-content:center;z-index:1000;pointer-events:none;}
.loading-box{background:#fff;border-radius:10px;padding:26px 40px;box-shadow:0 4px 28px rgba(0,0,0,.3);font-size:19px;font-weight:700;color:var(--navy);text-align:center;min-width:320px;}
.pin-logo{font-weight:900;color:var(--navy);letter-spacing:1px;font-size:20px;margin-bottom:6px;}
.pin-box label,.pin-mgr-box label{display:block;text-align:left;font-size:12.5px;font-weight:600;margin:12px 0 4px;}
.pin-box select,.pin-box input,.pin-mgr-box input{width:100%;padding:8px;border:1px solid #bbb;border-radius:4px;font-size:14px;}
.pin-btn{margin-top:18px;width:100%;padding:10px;background:var(--navy);color:#fff;border:none;border-radius:4px;font-weight:700;cursor:pointer;}
.pin-err{color:var(--err);font-size:12.5px;min-height:18px;margin-top:6px;}
.pin-row{display:flex;align-items:center;gap:8px;margin:8px 0;text-align:left;}
.pin-row label{min-width:80px;margin:0;}
.result-count{display:inline-block;font-size:17px;font-weight:800;color:#5b2c8a;background:#eee0f7;border:2px solid #8e44ad;border-radius:6px;padding:5px 14px;min-width:20px;text-align:center;}
.result-count:empty{display:none;}
.code-badge{display:inline-block;background:var(--orange);color:#fff;font-weight:800;border-radius:4px;padding:1px 8px;font-size:12px;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>

<div class="hdr-bar">
  <div class="logo">EDUCPASS</div>
  <div class="title">📶 NIVEAUX — 2026</div>
  <button class="btn" id="btn-pin-mgr" onclick="showGestionPins()" style="display:none;">🔑 PINs</button>
  <a class="btn" href="../TABLEAU DE BORD.html" style="background:var(--navy-dark);color:#fff;text-decoration:none;display:inline-block;" title="Retour au Tableau de Bord">🗂️ Tableau de Bord</a>
  <button class="btn" onclick="logoutPin()">🔒 <span id="header-agent">—</span></button>
</div>

<div id="sync-pending">⏳ Synchronisation en cours…</div>
<div id="st-bar"></div>
<div id="overlay-loading" class="hidden">
  <div class="loading-box" id="loading-msg"></div>
</div>

<div class="wrap">

  <!-- ====================== SECTION NIVEAUX ======================
       Table de référence "Niveaux d'enseignement" (remplace l'écran WinDev
       "Gestion des niveaux" / Paramètres Système). Gestion CRUD simple d'une
       liste Code + Description + Libellé court. Alimentée le 2026-09-07 à
       partir de l'export réel fourni par Marc (13 niveaux). Ne modifie PAS
       le champ Profs.Niveau (texte libre non normalisé) — voir mémoire du
       projet : normalisation/liaison prévue plus tard, pas dans ce tour. -->
  <div id="section-niveaux">
    <div class="toolbar">
      <button class="btn btn-save" onclick="newNiveau()">➕ Nouveau niveau</button>
      <button class="btn" onclick="showNiveauxView('liste')">📄 Liste des niveaux</button>
      <span id="niveaux-count" class="result-count"></span>
    </div>

    <!-- ---------------- Vue liste Niveaux ---------------- -->
    <div id="view-niveaux-liste">
      <div style="max-height:75vh;overflow:auto;">
        <table class="results" id="tbl-niveaux">
          <thead><tr>
            <th style="width:70px;">Code</th><th>Description</th><th>Libellé court</th>
          </tr></thead>
          <tbody id="tbl-niveaux-body"></tbody>
        </table>
      </div>
    </div>

    <!-- ---------------- Vue fiche Niveau ---------------- -->
    <div id="view-niveaux-fiche" class="hidden">
      <div class="fiche-box">
        <div class="fiche-hdr" id="niveau-titre">—</div>
        <div class="fiche-sub">Table de référence — utilisée à terme pour normaliser le champ « Niveau » des fiches Profs.</div>

        <div style="margin:14px 0;">
          <button class="btn btn-save" id="btn-save-niveau" onclick="saveNiveau()">💾 Enregistrer</button>
          <button class="btn btn-cancel" onclick="cancelNiveauAndReset()">↩️ Annuler</button>
          <button class="btn" id="btn-delete-niveau" onclick="deleteNiveau()" style="display:none;background:var(--err);color:#fff;">🗑️ Supprimer</button>
        </div>

        <div id="niveau-fiche-sections"></div>

        <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line);">
          <button class="btn btn-save" onclick="saveNiveau()">💾 Enregistrer</button>
          <button class="btn btn-cancel" onclick="cancelNiveauAndReset()">↩️ Annuler</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ====================== OVERLAY LOGIN PIN ====================== -->
<div id="overlay-pin" class="hidden">
  <div class="pin-box">
    <div class="pin-logo">EDUCPASS</div>
    <h2>🔐 Accès sécurisé</h2>
    <label>Agent :</label>
    <select id="pin-agent">
      <option value="">— Sélectionnez —</option>
      <option>MARC</option>
      <option>MAÏTE</option>
      
      <option>VANESSA</option>
    </select>
    <label>Code PIN (4 chiffres) :</label>
    <input type="password" id="pin-code" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" placeholder="••••" autocomplete="off" oninput="if(this.value.length===4)loginPin()">
    <div id="pin-error" class="pin-err"></div>
    <button class="pin-btn" onclick="loginPin()">Connexion →</button>
  </div>
</div>

<!-- ====================== OVERLAY GESTION PINS (MARC uniquement) ====================== -->
<div id="overlay-pin-mgr" class="hidden">
  <div class="pin-mgr-box">
    <h2>🔑 Gestion des codes PIN</h2>
    <div class="pin-row"><label>MARC :</label><input type="password" id="pm-marc" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="off"></div>
    <div class="pin-row"><label>MAÏTE :</label><input type="password" id="pm-maite" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="off"></div>
    <div class="pin-row"><label>VANESSA :</label><input type="password" id="pm-vanessa" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="off"></div>
    <div class="pin-err" id="pm-msg"></div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn btn-cancel" onclick="closeGestionPins()">Annuler</button>
      <button class="btn btn-save" onclick="saveGestionPins()">💾 Enregistrer</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
//  CONFIG AIRTABLE — même proxy Cloudflare Worker que FICHIER PROFS 2026.html,
//  PRODUITS.html et PROMOS.html (jeton Airtable caché côté serveur).
// ══════════════════════════════════════════════════════════
const PROXY = 'https://educpass-profs-proxy.marc-flasschoen.workers.dev';
const BASE  = 'appWCfo8WBkMGUuc2';
const HDRS  = {'Content-Type':'application/json'};

// Table "Niveaux" — référence des niveaux d'enseignement (remplace l'écran
// WinDev "Gestion des niveaux"). Peu d'enregistrements (~13 pour l'instant).
const NIVEAUX_TBL = 'tblBycloJ7cA3FGAH';
const NIVEAUX_API = `${PROXY}/v0/${BASE}/${NIVEAUX_TBL}`;

// ══════════════════════════════════════════════════════════
//  NIVEAUX — mapping id Airtable <-> clé DOM <-> libellé <-> type
// ══════════════════════════════════════════════════════════
const NIVEAUX_SECTIONS = [
  {title:'Niveau', fields:[
    ['fldemZfUPpp9Kjnn1','code','Code','text'],
    ['fldgEjlaillqclaVx','description','Description','text'],
    ['fldKFhg9BZna0PkAH','libellecourt','Libellé court','text'],
  ]},
];
const NIVEAU_KEY_TO_NAME = {};
NIVEAUX_SECTIONS.forEach(sec=>sec.fields.forEach(([fid,key,label])=>{ NIVEAU_KEY_TO_NAME[key]=label; }));

// ══════════════════════════════════════════════════════════
//  ÉTAT
// ══════════════════════════════════════════════════════════
let lastNiveaux = [];
let curNiveauId = null;
let _niveauLoading = false;
let _niveauDirty = false;

function setSt(msg){
  document.getElementById('st-bar').textContent = msg || '';
  const box = document.getElementById('overlay-loading');
  const isLoading = !!msg && (msg.indexOf('🔎')===0 || msg.indexOf('⏳')===0);
  if(isLoading){
    document.getElementById('loading-msg').textContent = msg;
    box.classList.remove('hidden');
  } else {
    box.classList.add('hidden');
  }
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ══════════════════════════════════════════════════════════
//  APPELS AIRTABLE
// ══════════════════════════════════════════════════════════
async function atFetch(url, opts){
  const r = await fetch(url, Object.assign({headers:HDRS}, opts||{}));
  if(!r.ok){
    const t = await r.text().catch(()=> '');
    throw new Error('Airtable '+r.status+' : '+t.slice(0,200));
  }
  return r.json();
}

// ══════════════════════════════════════════════════════════
//  NIVEAUX — liste + fiche
// ══════════════════════════════════════════════════════════
function fldN(key){ return document.getElementById('n-'+key); }
function svN(key, v){
  const el = fldN(key); if(!el) return;
  el.value = (v==null) ? '' : v;
}
function markNiveauDirty(){ _niveauDirty = true; }

function buildNiveauForm(){
  const wrap = document.getElementById('niveau-fiche-sections');
  wrap.innerHTML = '';
  NIVEAUX_SECTIONS.forEach(sec=>{
    const fs = document.createElement('fieldset');
    const lg = document.createElement('legend'); lg.textContent = sec.title; fs.appendChild(lg);
    const row = document.createElement('div'); row.className='frow';
    sec.fields.forEach(([fid,key,label,type])=>{
      const item = document.createElement('div'); item.className='fitem';
      const lab = document.createElement('label'); lab.textContent = label; item.appendChild(lab);
      const input = document.createElement('input');
      input.type = 'text';
      input.id = 'n-'+key;
      input.dataset.fieldId = fid;
      input.oninput = markNiveauDirty;
      item.appendChild(input);
      row.appendChild(item);
    });
    fs.appendChild(row);
    wrap.appendChild(fs);
  });
}

function fillNiveauForm(fields){
  NIVEAUX_SECTIONS.forEach(sec=>sec.fields.forEach(([fid,key])=> svN(key, fields[NIVEAU_KEY_TO_NAME[key]]) ));
}

function setSaveDisabledNiveau(v){ document.getElementById('btn-save-niveau').disabled = v; }
function setDeleteVisibleNiveau(v){ document.getElementById('btn-delete-niveau').style.display = v ? '' : 'none'; }

async function loadNiveaux(){
  document.getElementById('niveaux-count').textContent = '⏳';
  try{
    let all = [], offset;
    do{
      const params = new URLSearchParams({pageSize:'100'});
      if(offset) params.set('offset', offset);
      const data = await atFetch(NIVEAUX_API+'?'+params.toString());
      all = all.concat(data.records||[]);
      offset = data.offset;
    } while(offset);
    all.sort((a,b)=> String(a.fields['Code']||'').localeCompare(String(b.fields['Code']||''), 'fr', {numeric:true}));
    lastNiveaux = all;
    renderNiveauxTable();
    document.getElementById('niveaux-count').textContent = all.length;
  }catch(e){ setSt('❌ '+e.message); document.getElementById('niveaux-count').textContent = ''; }
}

function renderNiveauxTable(){
  const tbody = document.getElementById('tbl-niveaux-body');
  tbody.innerHTML = '';
  lastNiveaux.forEach(rec=>{
    const f = rec.fields;
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><span class="code-badge">'+esc(f['Code']||'')+'</span></td><td>'+esc(f['Description']||'')+'</td><td>'+esc(f['Libellé court']||'')+'</td>';
    tr.onclick = ()=>openNiveau(rec.id);
    tbody.appendChild(tr);
  });
}

async function openNiveau(id){
  if(_niveauDirty && !confirm('Des modifications non enregistrées seront perdues. Continuer ?')) return;
  _niveauLoading = true;
  setSaveDisabledNiveau(true);
  setSt('⏳ Chargement du niveau...');
  try{
    const data = await atFetch(NIVEAUX_API+'/'+id);
    curNiveauId = id;
    _niveauDirty = false;
    document.getElementById('niveau-titre').textContent = (data.fields['Code']||'—') + ' — ' + (data.fields['Description']||'');
    fillNiveauForm(data.fields);
    setDeleteVisibleNiveau(true);
    showNiveauxView('fiche');
    setSt('');
  }catch(e){ setSt('❌ '+e.message); }
  finally{ _niveauLoading=false; setSaveDisabledNiveau(false); }
}

function newNiveau(){
  if(_niveauDirty && !confirm('Des modifications non enregistrées seront perdues. Continuer ?')) return;
  curNiveauId = null;
  _niveauDirty = false;
  document.getElementById('niveau-titre').textContent = 'Nouveau niveau';
  buildNiveauForm();
  setDeleteVisibleNiveau(false);
  showNiveauxView('fiche');
}

async function saveNiveau(){
  if(_niveauLoading){ setSt('⏳ Chargement en cours, réessaie dans un instant.'); return; }
  const fields = {};
  NIVEAUX_SECTIONS.forEach(sec=>sec.fields.forEach(([fid,key,label])=>{
    const el = fldN(key); if(!el) return;
    const v = el.value;
    if(v==='') return; // on n'écrase pas avec du vide
    fields[label] = v;
  }));
  if(!fields['Code']){ setSt('❌ Le Code est obligatoire.'); return; }
  document.getElementById('sync-pending').classList.add('show');
  setSaveDisabledNiveau(true);
  try{
    if(curNiveauId){
      await atFetch(NIVEAUX_API+'/'+curNiveauId, {method:'PATCH', body: JSON.stringify({fields})});
      setSt('✅ Niveau enregistré.');
    } else {
      const res = await atFetch(NIVEAUX_API, {method:'POST', body: JSON.stringify({records:[{fields}]})});
      curNiveauId = res.records[0].id;
      setSt('✅ Nouveau niveau créé.');
    }
    _niveauDirty = false;
    await loadNiveaux();
    await openNiveau(curNiveauId);
  }catch(e){ setSt('❌ '+e.message); }
  finally{
    document.getElementById('sync-pending').classList.remove('show');
    setSaveDisabledNiveau(false);
  }
}

function cancelNiveauAndReset(){
  if(_niveauDirty && !confirm('Annuler les modifications non enregistrées ?')) return;
  _niveauDirty = false;
  curNiveauId = null;
  showNiveauxView('liste');
}

// Suppression réservée à MARC, même règle que les autres outils.
async function deleteNiveau(){
  if(sessionStorage.getItem('auth_agent')!=='MARC') return;
  if(!curNiveauId){ setSt('Aucun niveau chargé à supprimer.'); return; }
  const idToDelete = curNiveauId;
  const titre = document.getElementById('niveau-titre').textContent;
  if(!confirm('⚠️ SUPPRESSION DÉFINITIVE\n\nSupprimer définitivement le niveau "'+titre+'" ?\n\nCette action est IRRÉVERSIBLE.')) return;
  setSt('⏳ Suppression en cours...');
  try{
    await atFetch(NIVEAUX_API+'/'+idToDelete, {method:'DELETE'});
    lastNiveaux = lastNiveaux.filter(r=>r.id!==idToDelete);
    curNiveauId = null; _niveauDirty = false;
    renderNiveauxTable();
    showNiveauxView('liste');
    setSt('✅ Niveau supprimé définitivement.');
  }catch(e){ setSt('❌ '+e.message); }
}

function showNiveauxView(v){
  document.getElementById('view-niveaux-liste').classList.toggle('hidden', v!=='liste');
  document.getElementById('view-niveaux-fiche').classList.toggle('hidden', v!=='fiche');
}

// ══════════════════════════════════════════════════════════
//  SYSTÈME PIN — AUTHENTIFICATION (identique aux autres outils EDUCPASS)
//  Stockage indépendant, clé localStorage dédiée à ce fichier.
// ══════════════════════════════════════════════════════════
const AGENT_PINS_DEFAULT = { 'MARC':'1111', 'MAÏTE':'2222', 'VANESSA':'4444' };
let AGENT_PINS = (function(){
  try{
    const stored = localStorage.getItem('educpass_niveaux_pins');
    if(stored){ const p=JSON.parse(stored); if(p&&p.MARC) return p; }
  }catch(e){}
  return Object.assign({}, AGENT_PINS_DEFAULT);
})();

function _setAgentSession(agent){
  sessionStorage.setItem('auth_agent', agent);
  document.getElementById('header-agent').textContent = agent;
  document.getElementById('btn-pin-mgr').style.display = (agent==='MARC') ? '' : 'none';
  setDeleteVisibleNiveau(false);
}
function loginPin(){
  const agent = document.getElementById('pin-agent').value;
  const pin = document.getElementById('pin-code').value;
  const err = document.getElementById('pin-error');
  err.textContent='';
  if(!agent){ err.textContent='Sélectionnez votre nom.'; return; }
  if(pin.length!==4){ err.textContent='Le code doit contenir 4 chiffres.'; return; }
  if(AGENT_PINS[agent]!==pin){
    err.textContent='❌ Code incorrect — réessayez.';
    document.getElementById('pin-code').value=''; document.getElementById('pin-code').focus();
    return;
  }
  document.getElementById('overlay-pin').classList.add('hidden');
  _setAgentSession(agent);
  init();
}
function logoutPin(){
  if(!confirm('Se déconnecter ?')) return;
  sessionStorage.removeItem('auth_agent');
  location.reload();
}
function showGestionPins(){
  if(sessionStorage.getItem('auth_agent')!=='MARC') return;
  document.getElementById('pm-marc').value = AGENT_PINS['MARC']||'';
  document.getElementById('pm-maite').value = AGENT_PINS['MAÏTE']||'';
  document.getElementById('pm-vanessa').value = AGENT_PINS['VANESSA']||'';
  document.getElementById('pm-msg').textContent='';
  document.getElementById('overlay-pin-mgr').classList.remove('hidden');
}
function closeGestionPins(){ document.getElementById('overlay-pin-mgr').classList.add('hidden'); }
function saveGestionPins(){
  const pins = {
    MARC: document.getElementById('pm-marc').value.trim(),
    'MAÏTE': document.getElementById('pm-maite').value.trim(),
    VANESSA: document.getElementById('pm-vanessa').value.trim(),
  };
  for(const [agent,pin] of Object.entries(pins)){
    if(pin && !/^\d{4}$/.test(pin)){
      document.getElementById('pm-msg').style.color='#c0392b';
      document.getElementById('pm-msg').textContent='❌ PIN de '+agent+' invalide — 4 chiffres requis.';
      return;
    }
    if(!pin) pins[agent]=AGENT_PINS[agent];
  }
  try{
    localStorage.setItem('educpass_niveaux_pins', JSON.stringify(pins));
    Object.assign(AGENT_PINS, pins);
    document.getElementById('pm-msg').style.color='#27ae60';
    document.getElementById('pm-msg').textContent='✅ Codes PIN enregistrés !';
    setTimeout(closeGestionPins, 1200);
  }catch(e){
    document.getElementById('pm-msg').style.color='#c0392b';
    document.getElementById('pm-msg').textContent='❌ Erreur : '+e.message;
  }
}

// ══════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════
function init(){
  buildNiveauForm();
  showNiveauxView('liste');
  loadNiveaux();
}

document.addEventListener('DOMContentLoaded', function(){
  const saved = sessionStorage.getItem('auth_agent');
  if(saved && AGENT_PINS[saved]){
    _setAgentSession(saved);
    init();
  } else {
    document.getElementById('overlay-pin').classList.remove('hidden');
  }
});
</script>
</body>
</html>
