<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma carte — Educpass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#faf5e8;
  --paper-2:#f1e9d6;
  --page-bg:#e9dcb8;
  --teal:#0f3d3e;
  --teal-dark:#0a2b2c;
  --green-dark:#164a2e;
  --gold:#c89b3c;
  --gold-light:#e6c878;
  --line:#d8cca4;
  --text:#2a2118;
  --text-soft:#5c5344;
  --off:#8a7f6a;
  --err:#a5432a;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--text);font-family:'Work Sans',Arial,sans-serif;min-height:100vh;}
.site-header{background:var(--green-dark);box-shadow:0 2px 12px rgba(10,20,18,.28);}
.site-header-inner{max-width:720px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.site-logo{font-family:'Fraunces',serif;font-weight:700;font-size:17px;color:var(--paper);letter-spacing:.5px;}
.site-logo b{color:var(--gold-light);}
.compte-nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
.compte-nav a,.compte-nav span{font-size:12.5px;padding:7px 12px;border-radius:7px;text-decoration:none;color:var(--paper-2);font-weight:600;white-space:nowrap;}
.compte-nav a:hover{background:rgba(255,255,255,.1);}
.compte-nav a.actif{background:var(--gold);color:var(--teal-dark);}
.compte-nav span.desactive{opacity:.5;cursor:not-allowed;}
.compte-nav a.deconnexion{color:#f0c9bc;}

.wrap{max-width:720px;margin:0 auto;padding:26px 20px 60px;display:flex;flex-direction:column;align-items:center;}
h1.title{font-family:'Fraunces',serif;font-weight:700;font-size:24px;color:var(--teal-dark);margin:0 0 6px;text-wrap:balance;text-align:center;}
.subtitle{color:var(--text-soft);font-size:13.5px;margin:0 0 26px;line-height:1.5;text-align:center;max-width:460px;}

#overlay-loading{position:fixed;inset:0;background:rgba(15,61,62,.35);display:flex;align-items:center;justify-content:center;z-index:1000;}
.loading-box{background:var(--paper);border-radius:12px;padding:22px 34px;box-shadow:0 4px 28px rgba(0,0,0,.3);font-size:16px;font-weight:700;color:var(--teal-dark);text-align:center;min-width:260px;}
.hidden{display:none !important;}
.msg-box{border-radius:9px;padding:12px 16px;font-size:13.5px;line-height:1.5;margin-bottom:16px;background:#fbe6e0;border:1px solid #e3a48f;color:#7a2c17;max-width:460px;}

/* ===== Carte digitale (2026-09-28 : visuel officiel fourni par Marc, reconstruit après perte de la version du 14/09) =====
   Le vrai gabarit (logo Educpass sur fond hachuré + vague orange + "European teacher card") est l'image de fond,
   embarquée en base64. Les champs du prof sont superposés en position absolue, en % et en unités cqw
   (proportions identiques quelle que soit la largeur de l'écran). Police Calibri, sans mention "FRANCE". */

  position:relative;width:440px;max-width:100%;aspect-ratio:720 / 466;container-type:inline-size;

      <a href="#" id="lien-deconnexion" class="deconnexion">Déconnexion</a>
    </nav>
  </div>
</div>

<div id="overlay-loading" class="hidden"><div class="loading-box" id="loading-msg"></div></div>

<div class="wrap">
  <h1 class="title">Ma carte Educpass</h1>
  <p class="subtitle">Votre carte numérique d'enseignant, à présenter chez nos partenaires.</p>

  <div class="msg-box hidden" id="msg-erreur"></div>

  <div class="carte hidden" id="carte" role="img" aria-label="Carte Educpass European teacher card">
    <div class="carte-nom" id="carte-nom"></div>
    <div class="carte-adresse" id="carte-adresse"></div>
    <div class="carte-membre" id="carte-nmembre"></div>
    <div class="carte-annee" id="carte-annee"></div>
  </div>

  <p class="note-carte">Présentez cette page (ou une capture d'écran) chez un partenaire Educpass.</p>
</div>

<script>
const PROXY = 'https://educpass-profs-proxy.marc-flasschoen.workers.dev';

// 2026-09-28 : l'année est stockée sur 2 chiffres dans Airtable (27) → affichée "2027" sur la carte.
function anneeLisible(a){ a = String(a||'').trim(); return /^\d{2}$/.test(a) ? '20' + a : a; }

// ── Session : stockage en double (localStorage + cookie), identique à cotisation.html ──
// Un cookie longue durée (180 jours) prend le relais si le localStorage disparaît
// (Safari iOS notamment), pour éviter les reconnexions intempestives.
const SESSION_COOKIE_MAX_AGE_S = 180 * 24 * 60 * 60;
function setCookie(nom, valeur, maxAgeS){
  try{
    document.cookie = nom + '=' + encodeURIComponent(valeur) + '; path=/; max-age=' + maxAgeS + '; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
  }catch(e){}
}
function getCookie(nom){
  try{
    const m = document.cookie.match(new RegExp('(?:^|; )' + nom.replace(/([.$?*|{}()\[\]\\\/+^])/g, '\\$1') + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }catch(e){ return null; }
}
function removeCookie(nom){
  try{ document.cookie = nom + '=; path=/; max-age=0'; }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem('educpass_session'); }catch(e){}
  removeCookie('educpass_session');
}
function getSession(){
  try{
    const brut = localStorage.getItem('educpass_session');
    if(brut) return JSON.parse(brut);
  }catch(e){}
  const brutCookie = getCookie('educpass_session');
  if(brutCookie){
    try{ localStorage.setItem('educpass_session', brutCookie); }catch(e){}
    try{ return JSON.parse(brutCookie); }catch(e){ return null; }
  }
  return null;
}
const session = getSession();
if(!session || !session.token){
  location.href = 'connexion-fr.html';
}

document.getElementById('lien-deconnexion').addEventListener('click', (e)=>{
  e.preventDefault();
  clearSession();
  location.href = 'ACCUEIL.html';
});

function setSt(msg){
  document.getElementById('loading-msg').textContent = msg || '';
  document.getElementById('overlay-loading').classList.toggle('hidden', !msg);
}

async function chargerCarte(){
  setSt('⏳ Chargement de votre carte...');
  try{
    const r = await fetch(`${PROXY}/account/me`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token: session.token }),
    });
    const data = await r.json().catch(()=> ({}));
    if(!r.ok || !data.ok){
      if(r.status === 401){
        clearSession();
        location.href = 'connexion-fr.html';
        return;
      }
      throw new Error(data.error || 'Erreur inconnue');
    }
    const c = data.compte;
    document.getElementById('carte-nom').textContent = (c.prenom + ' ' + c.nom).trim().toUpperCase();
    const adresseLigne1 = [c.rue, c.nMaison].filter(Boolean).join(', ');
    const adresseLigne2 = [c.cp, c.ville].filter(Boolean).join(' - ');
    document.getElementById('carte-adresse').innerHTML = [adresseLigne1, adresseLigne2].filter(Boolean).map(l=>l).join('<br>');
    document.getElementById('carte-nmembre').textContent = c.membre ? ('N° de membre : ' + c.membre) : '';
    document.getElementById('carte-annee').textContent = anneeLisible(c.anneeCotisation);
    // 2026-09-28 : pas de QR code sur la carte (décision de Marc).

    document.getElementById('carte').classList.remove('hidden');
  }catch(e){
    const box = document.getElementById('msg-erreur');
    box.textContent = "Impossible de charger votre carte : " + e.message + ". Rechargez la page ou reconnectez-vous.";
    box.classList.remove('hidden');
  }finally{
    setSt('');
  }
}
chargerCarte();
</script>

</body>
</html>
