<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRODUITS — EDUCPASS 2026</title>
<style>
:root{
  --navy:#1e3a6e; --navy-dark:#152a52; --orange:#c55a11; --bg:#f0f4fa;
  --line:#d7e0ee; --ok:#27ae60; --err:#c0392b;
}
*{box-sizing:border-box;}
body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:#222;}
.hdr-bar{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.hdr-bar .logo{font-weight:900;letter-spacing:1px;}
.hdr-bar .title{font-weight:700;flex:1;}
.btn{border:none;border-radius:4px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;background:#eee;color:#222;}
.btn:hover{filter:brightness(0.95);}
.btn-save{background:var(--ok);color:#fff;}
.btn-cancel{background:#888;color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.toolbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#st-bar{padding:4px 16px;font-size:12px;color:#555;min-height:18px;}
#sync-pending{display:none;background:#f39c12;color:#fff;text-align:center;padding:4px;font-weight:700;font-size:12px;}
#sync-pending.show{display:block;animation:pulse 1s infinite alternate;}
@keyframes pulse{from{opacity:.6}to{opacity:1}}
.wrap{padding:14px 16px;}
table.results{border-collapse:collapse;width:100%;background:#fff;font-size:12.5px;}
table.results th{background:var(--navy);color:#fff;padding:6px 8px;text-align:left;position:sticky;top:0;white-space:nowrap;}
table.results td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.results tr:nth-child(even){background:#f7faff;}
table.results tr:hover{background:#eaf1ff;cursor:pointer;}
.fiche-box{background:#fff;border-radius:6px;box-shadow:0 1px 6px rgba(30,58,110,.12);padding:16px 20px;max-width:1100px;}
.fiche-hdr{font-size:20px;font-weight:900;color:var(--navy);margin-bottom:4px;}
.fiche-sub{color:#777;font-size:13px;margin-bottom:14px;}
fieldset{border:1px solid var(--line);border-radius:6px;margin-bottom:14px;padding:10px 14px 14px;}
legend{font-weight:700;color:var(--navy);padding:0 6px;font-size:13px;}
.frow{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px;}
.fitem label{display:block;font-size:11.5px;color:#555;margin-bottom:2px;font-weight:600;}
.fitem input,.fitem select,.fitem textarea{width:100%;padding:6px 7px;border:1px solid #bbb;border-radius:4px;font-size:13px;font-family:inherit;}
.fitem textarea{min-height:52px;resize:vertical;}
.hidden{display:none !important;}
.pin-box,.pin-mgr-box{background:#fff;border-radius:8px;padding:32px 40px;box-shadow:0 2px 20px rgba(0,0,0,.25);text-align:center;min-width:320px;}
#overlay-pin,#overlay-pin-mgr{position:fixed;inset:0;background:rgba(20,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:999;}
#overlay-loading{position:fixed;inset:0;background:rgba(20,30,50,.35);display:flex;align-items:center;justify-content:center;z-index:1000;pointer-events:none;}
.loading-box{background:#fff;border-radius:10px;padding:26px 40px;box-shadow:0 4px 28px rgba(0,0,0,.3);font-size:19px;font-weight:700;color:var(--navy);text-align:center;min-width:320px;}
.pin-logo{font-weight:900;color:var(--navy);letter-spacing:1px;font-size:20px;margin-bottom:6px;}
.pin-box label,.pin-mgr-box label{display:block;text-align:left;font-size:12.5px;font-weight:600;margin:12px 0 4px;}
.pin-box select,.pin-box input,.pin-mgr-box input{width:100%;padding:8px;border:1px solid #bbb;border-radius:4px;font-size:14px;}
.pin-btn{margin-top:18px;width:100%;padding:10px;background:var(--navy);color:#fff;border:none;border-radius:4px;font-weight:700;cursor:pointer;}
.pin-err{color:var(--err);font-size:12.5px;min-height:18px;margin-top:6px;}
.pin-row{display:flex;align-items:center;gap:8px;margin:8px 0;text-align:left;}
.pin-row label{min-width:80px;margin:0;}
.result-count{display:inline-block;font-size:17px;font-weight:800;color:#5b2c8a;background:#eee0f7;border:2px solid #8e44ad;border-radius:6px;padding:5px 14px;min-width:20px;text-align:center;}
.result-count:empty{display:none;}
</style>
</head>
<body>

<div class="hdr-bar">
  <div class="logo">EDUCPASS</div>
  <div class="title">📦 PRODUITS — 2026</div>
  <button class="btn" id="btn-pin-mgr" onclick="showGestionPins()" style="display:none;">🔑 PINs</button>
  <a class="btn" href="TABLEAU DE BORD.html" style="background:var(--navy-dark);color:#fff;text-decoration:none;display:inline-block;" title="Retour au Tableau de Bord">🗂️ Tableau de Bord</a>
  <button class="btn" onclick="logoutPin()">🔒 <span id="header-agent">—</span></button>
</div>

<div id="sync-pending">⏳ Synchronisation en cours…</div>
<div id="st-bar"></div>
<div id="overlay-loading" class="hidden">
  <div class="loading-box" id="loading-msg"></div>
</div>

<div class="wrap">

  <!-- ====================== SECTION PRODUITS ======================
       Fichier séparé (2026-09-07, demande de Marc) : Produits n'est plus un
       module intégré à FICHIER PROFS 2026.html mais son propre outil,
       accessible depuis le Tableau de bord. Cotisations profs (Formule
       digitale, VIP avec/sans carte PVC). Table Airtable "Produits", même
       base que Profs mais table séparée. -->
  <div id="section-produits">
    <div class="toolbar">
      <button class="btn btn-save" onclick="newProduit()">➕ Nouveau produit</button>
      <button class="btn" onclick="showProduitsView('liste')">📄 Liste des produits</button>
      <span id="produits-count" class="result-count"></span>
    </div>

    <!-- ---------------- Vue liste Produits ---------------- -->
    <div id="view-produits-liste">
      <div style="max-height:75vh;overflow:auto;">
        <table class="results" id="tbl-produits">
          <thead><tr>
            <th>Référence</th><th>Libellé FR</th><th>Libellé NL</th><th>Prix</th><th>Logo</th>
          </tr></thead>
          <tbody id="tbl-produits-body"></tbody>
        </table>
      </div>
    </div>

    <!-- ---------------- Vue fiche Produit ---------------- -->
    <div id="view-produits-fiche" class="hidden">
      <div class="fiche-box">
        <div class="fiche-hdr" id="produit-titre">—</div>
        <div class="fiche-sub" id="produit-logo-preview">Aucun logo pour l'instant.</div>

        <div style="margin:14px 0;">
          <button class="btn btn-save" id="btn-save-produit" onclick="saveProduit()">💾 Enregistrer</button>
          <button class="btn btn-cancel" onclick="cancelProduitAndReset()">↩️ Annuler</button>
          <button class="btn" id="btn-delete-produit" onclick="deleteProduit()" style="display:none;background:var(--err);color:#fff;">🗑️ Supprimer</button>
        </div>

        <div id="produit-fiche-sections"></div>

        <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line);">
          <button class="btn btn-save" onclick="saveProduit()">💾 Enregistrer</button>
          <button class="btn btn-cancel" onclick="cancelProduitAndReset()">↩️ Annuler</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ====================== OVERLAY LOGIN PIN ====================== -->
<div id="overlay-pin" class="hidden">
  <div class="pin-box">
    <div class="pin-logo">EDUCPASS</div>
    <h2>🔐 Accès sécurisé</h2>
    <label>Agent :</label>
    <select id="pin-agent">
      <option value="">— Sélectionnez —</option>
      <option>MARC</option>
      <option>MAÏTE</option>
      <option>PASCAL</option>
      <option>VANESSA</option>
    </select>
    <label>Code PIN (4 chiffres) :</label>
    <input type="password" id="pin-code" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" placeholder="••••" autocomplete="off" oninput="if(this.value.length===4)loginPin()">
    <div id="pin-error" class="pin-err"></div>
    <button class="pin-btn" onclick="loginPin()">Connexion →</button>
  </div>
</div>

<!-- ====================== OVERLAY GESTION PINS (MARC uniquement) ====================== -->
<div id="overlay-pin-mgr" class="hidden">
  <div class="pin-mgr-box">
    <h2>🔑 Gestion des codes PIN</h2>
    <div class="pin-row"><label>MARC :</label><input type="password" id="pm-marc" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="off"></div>
    <div class="pin-row"><label>MAÏTE :</label><input type="password" id="pm-maite" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="off"></div>
    <div class="pin-row"><label>PASCAL :</label><input type="password" id="pm-pascal" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="off"></div>
    <div class="pin-row"><label>VANESSA :</label><input type="password" id="pm-vanessa" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="off"></div>
    <div class="pin-err" id="pm-msg"></div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn btn-cancel" onclick="closeGestionPins()">Annuler</button>
      <button class="btn btn-save" onclick="saveGestionPins()">💾 Enregistrer</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
//  CONFIG AIRTABLE — même proxy Cloudflare Worker que FICHIER PROFS 2026.html
//  et l'app Attractions (jeton Airtable caché côté serveur, jamais exposé ici).
// ══════════════════════════════════════════════════════════
const PROXY = 'https://educpass-profs-proxy.marc-flasschoen.workers.dev';
const BASE  = 'appWCfo8WBkMGUuc2';
const HDRS  = {'Content-Type':'application/json'};

// Table "Produits" — cotisations profs (Formule digitale, VIP avec/sans carte
// PVC). Même base Airtable que Profs, table séparée. Peu d'enregistrements
// (quelques dizaines au plus) : pas besoin de pagination filtrée comme pour Profs.
const PRODUITS_TBL = 'tblnEHRqjZ3XjW6vV';
const PRODUITS_API = `${PROXY}/v0/${BASE}/${PRODUITS_TBL}`;

// ══════════════════════════════════════════════════════════
//  PRODUITS — mapping id Airtable <-> clé DOM <-> libellé <-> type
// ══════════════════════════════════════════════════════════
const PRODUITS_CHOICES = {
  modelogo: ['Étiré','Homothétique centré']
};
const PRODUITS_SECTIONS = [
  {title:'Produit', fields:[
    ['fldeDXbJXokVLwzcE','reference','Référence','text'],
    ['fldbLP3x6oIGtWl34','libellefr','Libellé FR','text'],
    ['fldRbOYQNCCWnvLgo','libellenl','Libellé NL','text'],
    ['fldpSe1nSTpfD8RXH','prix','Prix','number'],
    ['fldXLnwPYRqHIlN4q','modelogo','Mode d’affichage logo','select:modelogo'],
  ]},
  {title:'Description', fields:[
    ['fld2d6dH3rIf6S0Vw','descriptionfr','Description FR','textarea'],
    ['fld0dmM1fN28gzCaH','descriptionnl','Description NL','textarea'],
  ]},
];
const FLD_LOGO = 'fldMIdgCW3XT9CJBk'; // champ pièce jointe — aperçu lecture seule, upload géré à part (voir note fiche)
const PRODUIT_KEY_TO_NAME = {};
PRODUITS_SECTIONS.forEach(sec=>sec.fields.forEach(([fid,key,label])=>{ PRODUIT_KEY_TO_NAME[key]=label; }));

// ══════════════════════════════════════════════════════════
//  ÉTAT
// ══════════════════════════════════════════════════════════
let lastProduits = [];
let curProduitId = null;
let _produitLoading = false;
let _produitDirty = false;

function setSt(msg){
  document.getElementById('st-bar').textContent = msg || '';
  const box = document.getElementById('overlay-loading');
  const isLoading = !!msg && (msg.indexOf('🔎')===0 || msg.indexOf('⏳')===0);
  if(isLoading){
    document.getElementById('loading-msg').textContent = msg;
    box.classList.remove('hidden');
  } else {
    box.classList.add('hidden');
  }
}
function esc(s){ return String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"'); }

// ══════════════════════════════════════════════════════════
//  APPELS AIRTABLE
// ══════════════════════════════════════════════════════════
async function atFetch(url, opts){
  const r = await fetch(url, Object.assign({headers:HDRS}, opts||{}));
  if(!r.ok){
    const t = await r.text().catch(()=> '');
    throw new Error('Airtable '+r.status+' : '+t.slice(0,200));
  }
  return r.json();
}

// ══════════════════════════════════════════════════════════
//  PRODUITS — liste + fiche
// ══════════════════════════════════════════════════════════
function fldP(key){ return document.getElementById('p-'+key); }
function gvP(key){ const el=fldP(key); if(!el) return null; const v=el.value; return v===''?null:v; }
function svP(key, v){
  const el = fldP(key); if(!el) return;
  if(v && typeof v==='object' && v.name) v = v.name;
  el.value = (v==null) ? '' : v;
}
function markProduitDirty(){ _produitDirty = true; }

function buildProduitForm(){
  const wrap = document.getElementById('produit-fiche-sections');
  wrap.innerHTML = '';
  PRODUITS_SECTIONS.forEach(sec=>{
    const fs = document.createElement('fieldset');
    const lg = document.createElement('legend'); lg.textContent = sec.title; fs.appendChild(lg);
    const row = document.createElement('div'); row.className='frow';
    sec.fields.forEach(([fid,key,label,type])=>{
      const item = document.createElement('div'); item.className='fitem';
      const lab = document.createElement('label'); lab.textContent = label; item.appendChild(lab);
      let input;
      if(type.startsWith('select:')){
        const choiceKey = type.split(':')[1];
        input = document.createElement('select');
        const empty=document.createElement('option'); empty.value=''; empty.textContent='—'; input.appendChild(empty);
        PRODUITS_CHOICES[choiceKey].forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; input.appendChild(o); });
      } else if(type==='textarea'){
        input = document.createElement('textarea');
      } else {
        input = document.createElement('input');
        input.type = (type==='number') ? 'number' : 'text';
      }
      input.id = 'p-'+key;
      input.dataset.fieldId = fid;
      input.oninput = markProduitDirty;
      item.appendChild(input);
      if(key==='prix'){
        const suf = document.createElement('span');
        suf.textContent = ' €';
        suf.style.cssText = 'margin-left:4px;font-weight:700;color:#555;';
        item.appendChild(suf);
      }
      row.appendChild(item);
    });
    fs.appendChild(row);
    wrap.appendChild(fs);
  });
}

function fillProduitForm(fields){
  PRODUITS_SECTIONS.forEach(sec=>sec.fields.forEach(([fid,key])=> svP(key, fields[PRODUIT_KEY_TO_NAME[key]]) ));
}

// Aperçu du logo — LECTURE SEULE pour l'instant : l'upload se fait directement
// dans Airtable (le Worker Cloudflare qui cache le jeton Airtable ne permet pas
// l'upload de pièce jointe depuis ce fichier — voir mémoire du projet). Marc
// glisse l'image sur le champ "Logo" dans Airtable, elle apparaît ici ensuite.
function renderLogoPreview(fields){
  const box = document.getElementById('produit-logo-preview');
  const att = fields && fields['Logo'];
  if(att && att.length){
    const url = (att[0].thumbnails && att[0].thumbnails.large) ? att[0].thumbnails.large.url : att[0].url;
    box.innerHTML = '<img src="'+esc(url)+'" alt="Logo" style="max-height:80px;max-width:160px;border:1px solid var(--line);border-radius:4px;vertical-align:middle;"> <span style="color:#777;">Logo géré directement dans Airtable (glisser-déposer sur le champ « Logo »).</span>';
  } else {
    box.innerHTML = '<span style="color:#999;">Aucun logo pour l\'instant — à ajouter directement dans Airtable (champ « Logo »).</span>';
  }
}

function setSaveDisabledProduit(v){ document.getElementById('btn-save-produit').disabled = v; }
function setDeleteVisibleProduit(v){ document.getElementById('btn-delete-produit').style.display = v ? '' : 'none'; }

async function loadProduits(){
  document.getElementById('produits-count').textContent = '⏳';
  try{
    let all = [], offset;
    do{
      const params = new URLSearchParams({pageSize:'100'});
      if(offset) params.set('offset', offset);
      const data = await atFetch(PRODUITS_API+'?'+params.toString());
      all = all.concat(data.records||[]);
      offset = data.offset;
    } while(offset);
    lastProduits = all;
    renderProduitsTable();
    document.getElementById('produits-count').textContent = all.length;
  }catch(e){ setSt('❌ '+e.message); document.getElementById('produits-count').textContent = ''; }
}

function renderProduitsTable(){
  const tbody = document.getElementById('tbl-produits-body');
  tbody.innerHTML = '';
  lastProduits.forEach(rec=>{
    const f = rec.fields;
    const tr = document.createElement('tr');
    const att = f['Logo'];
    const logoCell = (att && att.length) ? '<img src="'+esc((att[0].thumbnails&&att[0].thumbnails.small)?att[0].thumbnails.small.url:att[0].url)+'" style="height:56px;vertical-align:middle;">' : '—';
    tr.innerHTML = '<td>'+esc(f['Référence']||'')+'</td><td>'+esc(f['Libellé FR']||'')+'</td><td>'+esc(f['Libellé NL']||'')+'</td><td>'+(f['Prix']!=null?f['Prix']+' €':'')+'</td><td>'+logoCell+'</td>';
    tr.onclick = ()=>openProduit(rec.id);
    tbody.appendChild(tr);
  });
}

async function openProduit(id){
  if(_produitDirty && !confirm('Des modifications non enregistrées seront perdues. Continuer ?')) return;
  _produitLoading = true;
  setSaveDisabledProduit(true);
  setSt('⏳ Chargement du produit...');
  try{
    const data = await atFetch(PRODUITS_API+'/'+id);
    curProduitId = id;
    _produitDirty = false;
    document.getElementById('produit-titre').textContent = data.fields['Référence'] || '—';
    fillProduitForm(data.fields);
    renderLogoPreview(data.fields);
    setDeleteVisibleProduit(true);
    showProduitsView('fiche');
    setSt('');
  }catch(e){ setSt('❌ '+e.message); }
  finally{ _produitLoading=false; setSaveDisabledProduit(false); }
}

function newProduit(){
  if(_produitDirty && !confirm('Des modifications non enregistrées seront perdues. Continuer ?')) return;
  curProduitId = null;
  _produitDirty = false;
  document.getElementById('produit-titre').textContent = 'Nouveau produit';
  buildProduitForm();
  renderLogoPreview(null);
  setDeleteVisibleProduit(false);
  showProduitsView('fiche');
}

async function saveProduit(){
  if(_produitLoading){ setSt('⏳ Chargement en cours, réessaie dans un instant.'); return; }
  const fields = {};
  let numError = null;
  PRODUITS_SECTIONS.forEach(sec=>sec.fields.forEach(([fid,key,label,type])=>{
    const el = fldP(key); if(!el) return;
    let v = el.value;
    if(v==='') return; // on n'écrase pas avec du vide
    if(type==='number'){
      v = Number(v);
      if(isNaN(v)){ numError = numError || {label,val:el.value}; return; }
    }
    fields[label] = v;
  }));
  if(numError){ setSt('❌ Valeur invalide pour « '+numError.label+' » : "'+numError.val+'". Merci de n\'entrer que des chiffres.'); return; }
  if(!fields['Référence']){ setSt('❌ La Référence est obligatoire.'); return; }
  document.getElementById('sync-pending').classList.add('show');
  setSaveDisabledProduit(true);
  try{
    if(curProduitId){
      await atFetch(PRODUITS_API+'/'+curProduitId, {method:'PATCH', body: JSON.stringify({fields})});
      setSt('✅ Produit enregistré.');
    } else {
      const res = await atFetch(PRODUITS_API, {method:'POST', body: JSON.stringify({records:[{fields}]})});
      curProduitId = res.records[0].id;
      setSt('✅ Nouveau produit créé.');
    }
    _produitDirty = false;
    await loadProduits();
    await openProduit(curProduitId);
  }catch(e){ setSt('❌ '+e.message); }
  finally{
    document.getElementById('sync-pending').classList.remove('show');
    setSaveDisabledProduit(false);
  }
}

function cancelProduitAndReset(){
  if(_produitDirty && !confirm('Annuler les modifications non enregistrées ?')) return;
  _produitDirty = false;
  curProduitId = null;
  showProduitsView('liste');
}

// Suppression réservée à MARC, même règle que pour les Profs.
async function deleteProduit(){
  if(sessionStorage.getItem('auth_agent')!=='MARC') return;
  if(!curProduitId){ setSt('Aucun produit chargé à supprimer.'); return; }
  const idToDelete = curProduitId;
  const ref = document.getElementById('produit-titre').textContent;
  if(!confirm('⚠️ SUPPRESSION DÉFINITIVE\n\nSupprimer définitivement le produit "'+ref+'" ?\n\nCette action est IRRÉVERSIBLE.')) return;
  setSt('⏳ Suppression en cours...');
  try{
    await atFetch(PRODUITS_API+'/'+idToDelete, {method:'DELETE'});
    lastProduits = lastProduits.filter(r=>r.id!==idToDelete);
    curProduitId = null; _produitDirty = false;
    renderProduitsTable();
    showProduitsView('liste');
    setSt('✅ Produit supprimé définitivement.');
  }catch(e){ setSt('❌ '+e.message); }
}

function showProduitsView(v){
  document.getElementById('view-produits-liste').classList.toggle('hidden', v!=='liste');
  document.getElementById('view-produits-fiche').classList.toggle('hidden', v!=='fiche');
}

// ══════════════════════════════════════════════════════════
//  SYSTÈME PIN — AUTHENTIFICATION (identique aux autres outils EDUCPASS)
//  Stockage indépendant de FICHIER PROFS 2026.html (clé localStorage dédiée),
//  chaque fichier HTML local ayant sa propre origine de stockage.
// ══════════════════════════════════════════════════════════
const AGENT_PINS_DEFAULT = { 'MARC':'1111', 'MAÏTE':'2222', 'PASCAL':'3333', 'VANESSA':'4444' };
let AGENT_PINS = (function(){
  try{
    const stored = localStorage.getItem('educpass_produits_pins');
    if(stored){ const p=JSON.parse(stored); if(p&&p.MARC) return p; }
  }catch(e){}
  return Object.assign({}, AGENT_PINS_DEFAULT);
})();

function _setAgentSession(agent){
  sessionStorage.setItem('auth_agent', agent);
  document.getElementById('header-agent').textContent = agent;
  document.getElementById('btn-pin-mgr').style.display = (agent==='MARC') ? '' : 'none';
  setDeleteVisibleProduit(false);
}
function loginPin(){
  const agent = document.getElementById('pin-agent').value;
  const pin = document.getElementById('pin-code').value;
  const err = document.getElementById('pin-error');
  err.textContent='';
  if(!agent){ err.textContent='Sélectionnez votre nom.'; return; }
  if(pin.length!==4){ err.textContent='Le code doit contenir 4 chiffres.'; return; }
  if(AGENT_PINS[agent]!==pin){
    err.textContent='❌ Code incorrect — réessayez.';
    document.getElementById('pin-code').value=''; document.getElementById('pin-code').focus();
    return;
  }
  document.getElementById('overlay-pin').classList.add('hidden');
  _setAgentSession(agent);
  init();
}
function logoutPin(){
  if(!confirm('Se déconnecter ?')) return;
  sessionStorage.removeItem('auth_agent');
  location.reload();
}
function showGestionPins(){
  if(sessionStorage.getItem('auth_agent')!=='MARC') return;
  document.getElementById('pm-marc').value = AGENT_PINS['MARC']||'';
  document.getElementById('pm-maite').value = AGENT_PINS['MAÏTE']||'';
  document.getElementById('pm-pascal').value = AGENT_PINS['PASCAL']||'';
  document.getElementById('pm-vanessa').value = AGENT_PINS['VANESSA']||'';
  document.getElementById('pm-msg').textContent='';
  document.getElementById('overlay-pin-mgr').classList.remove('hidden');
}
function closeGestionPins(){ document.getElementById('overlay-pin-mgr').classList.add('hidden'); }
function saveGestionPins(){
  const pins = {
    MARC: document.getElementById('pm-marc').value.trim(),
    'MAÏTE': document.getElementById('pm-maite').value.trim(),
    PASCAL: document.getElementById('pm-pascal').value.trim(),
    VANESSA: document.getElementById('pm-vanessa').value.trim(),
  };
  for(const [agent,pin] of Object.entries(pins)){
    if(pin && !/^\d{4}$/.test(pin)){
      document.getElementById('pm-msg').style.color='#c0392b';
      document.getElementById('pm-msg').textContent='❌ PIN de '+agent+' invalide — 4 chiffres requis.';
      return;
    }
    if(!pin) pins[agent]=AGENT_PINS[agent];
  }
  try{
    localStorage.setItem('educpass_produits_pins', JSON.stringify(pins));
    Object.assign(AGENT_PINS, pins);
    document.getElementById('pm-msg').style.color='#27ae60';
    document.getElementById('pm-msg').textContent='✅ Codes PIN enregistrés !';
    setTimeout(closeGestionPins, 1200);
  }catch(e){
    document.getElementById('pm-msg').style.color='#c0392b';
    document.getElementById('pm-msg').textContent='❌ Erreur : '+e.message;
  }
}

// ══════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════
function init(){
  buildProduitForm();
  showProduitsView('liste');
  loadProduits();
}

document.addEventListener('DOMContentLoaded', function(){
  const saved = sessionStorage.getItem('auth_agent');
  if(saved && AGENT_PINS[saved]){
    _setAgentSession(saved);
    init();
  } else {
    document.getElementById('overlay-pin').classList.remove('hidden');
  }
});
</script>
