<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — Educpass</title>
<!-- 2026-11-14 : page « introuvable » de GitHub Pages. Les anciens liens du site Webnode (educpass.be/xxx/) et les pages
     disparues renvoient vers l'accueil. Racine = « / » sur educpass.be, « /fiches-profs-2026/ » sur flasschoen.github.io. -->
<script>(function(){
  var base = /github\.io$/i.test(location.hostname) ? '/fiches-profs-2026/' : '/';
  var q = location.search || '';
  // 2026-11-14 (Marc) : anciennes adresses du site Webnode .BE les plus visitées → bonne page du nouveau site
  var chemin = location.pathname.toLowerCase().replace(/^\/fiches-profs-2026/, '').replace(/\/+$/, '');
  var avantBascule = Date.now() < new Date('2027-01-17T21:00:00+01:00').getTime();   // même date que ACCUEIL.html
  var anciennes = {
    '/connexion-a-mon-compte': avantBascule ? 'https://www.educpass.eu/FR/Connexion.awp' : base + 'connexion-fr.html',
    '/partenaires-2026': base + 'AVANTAGES%20ENSEIGNANTS.html',
    '/avantages-enseignants': base + 'AVANTAGES%20ENSEIGNANTS.html',
    '/noel-en-fete': base + 'noel-en-fete.html'
  };
  if(anciennes[chemin]){ location.replace(anciennes[chemin]); return; }
  location.replace(base + 'ACCUEIL.html' + q);
})();</script>
<style>body{margin:0;font-family:Arial,sans-serif;background:#e9dcb8;color:#0f3d3e;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}a{color:#0f3d3e;font-weight:700}</style>
</head><body><div><h1>Page introuvable</h1><p>Redirection vers l'accueil… <a href="/ACCUEIL.html">Ouvrir l'accueil Educpass</a></p></div></body></html>
